name: V10 cloud drive file management end-to-end

on:
  workflow_dispatch:
  push:
    paths:
      - 'v10-cloud-drive-file-management/**'
      - '.github/workflows/v10-cloud-drive-file-management-e2e.yml'

jobs:
  fresh-install-and-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test create, select controls, rename, move and batch delete APIs
        run: python3 -m unittest -v v10-cloud-drive-file-management/tests/test_cloud_drive_file_management.py

      - name: Install complete V10 from a clean host
        run: |
          sudo timeout 12m bash v10-cloud-drive-file-management/install-vps-v10.sh | tee /tmp/v10-install.log
          grep -F '全部安装成功' /tmp/v10-install.log
          grep -F 'https://' /tmp/v10-install.log

      - name: Verify fixed port, credentials, data transfer and units
        run: |
          sudo systemctl is-active --quiet game-save-sync.service
          sudo systemctl is-active --quiet game-save-pc-enroller-v10.service
          sudo systemctl is-active --quiet game-save-drive.service
          sudo systemctl is-active --quiet game-save-drive-health.timer
          sudo systemctl is-enabled --quiet game-save-drive.service
          sudo systemctl is-enabled --quiet game-save-drive-health.timer
          test "$(sudo cat /var/lib/game-save-sync/web/port)" = 8443
          sudo ss -H -ltn 'sport = :8443' | grep -q .
          sudo systemctl show game-save-drive.service -p Restart --value | grep -Fx always
          sudo systemctl show game-save-drive.service -p MemoryMax --value | grep -Fx 134217728
          curl -kfsS https://127.0.0.1:8443/ | grep -Fq '<!doctype html>'
          curl -kfsS https://127.0.0.1:8443/certificate.pem | openssl x509 -checkend 2592000 -noout

      - name: Prove login survives restart and the timer repairs a stopped service
        run: |
          cookie=/tmp/v10-cookie
          curl -kfsS -c "$cookie" -H 'Content-Type: application/json' \
            --data '{"username":"marcel","password":"456qwe456"}' \
            https://127.0.0.1:8443/api/login | grep -Fq '"ok":true'
          curl -kfsS -b "$cookie" https://127.0.0.1:8443/api/list?path= | grep -Fq '"entries"'
          sudo systemctl stop game-save-drive.service
          ! curl -kfsS --max-time 2 https://127.0.0.1:8443/
          sudo /usr/local/sbin/game-save-drive-healthcheck
          sudo systemctl is-active --quiet game-save-drive.service
          curl -kfsS -b "$cookie" https://127.0.0.1:8443/api/list?path= | grep -Fq '"entries"'

      - name: Re-run complete installer as an in-place repair
        run: |
          sudo timeout 12m bash v10-cloud-drive-file-management/install-vps-v10.sh >/tmp/v10-repair.log
          grep -F 'V10 云盘已修复' /tmp/v10-repair.log
          curl -kfsS -H 'Content-Type: application/json' \
            --data '{"username":"marcel","password":"456qwe456"}' \
            https://127.0.0.1:8443/api/login | grep -Fq '"ok":true'
          sudo systemctl is-active --quiet game-save-drive.service
          sudo systemctl is-active --quiet game-save-drive-health.timer
          echo 'REAL V10 E2E PASSED: create, rename, move, delete, clean install, restart, repair and repeat install.'

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v10-cloud-drive-logs
          path: |
            /tmp/v10-install.log
            /tmp/v10-repair.log
