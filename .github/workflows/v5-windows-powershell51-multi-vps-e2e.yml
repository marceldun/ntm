name: V5 Windows PowerShell 5.1 multi-VPS end-to-end

on:
  workflow_dispatch:
  push:
    paths:
      - 'v5-multi-vps-f-drive/**'
      - '.github/workflows/v5-windows-powershell51-multi-vps-e2e.yml'

jobs:
  windows-multi-vps-e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Import two independent VPS peers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'syncthing-windows-amd64-v1.27.2.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'syncthing-v5-bin'
          $fBacking = Join-Path $env:RUNNER_TEMP 'FDrive'
          $servers = @()
          $allChecksPassed = $false
          try {
            New-Item -ItemType Directory -Path $extract,$fBacking -Force | Out-Null
            & subst.exe F: $fBacking
            $global:LASTEXITCODE = 0
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/syncthing/syncthing/releases/download/v1.27.2/syncthing-windows-amd64-v1.27.2.zip' -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b54eb32ea5a9888867195e1f20d649ad9866c0644483434f3f839330c1070d1b') { throw 'archive hash mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $serverExe = (Get-ChildItem $extract -Filter syncthing.exe -Recurse | Select-Object -First 1).FullName
            $android = 'XFQ7AJQ-34V53ZD-DCIHLSA-7TERDRR-27RXR54-FZCKF4I-F3FHCSC-NV4SZA3'
            $pythonExe = (Get-Command python.exe).Source
            $enrollerScript = Join-Path $PWD 'v5-multi-vps-f-drive/device-enroller-v5.py'

            for ($index = 1; $index -le 2; $index++) {
              $root = Join-Path $env:RUNNER_TEMP "v5-server-$index"
              $serverHome = Join-Path $root 'config'
              $files = Join-Path $root 'files'
              $tokenFile = Join-Path $root 'token'
              $log = Join-Path $root 'server.log'
              $stdout = Join-Path $root 'server.stdout.log'
              $stderr = Join-Path $root 'server.stderr.log'
              $enrollerOut = Join-Path $root 'enroller.stdout.log'
              $enrollerErr = Join-Path $root 'enroller.stderr.log'
              $guiPort = 38383 + $index
              $syncPort = 31999 + $index
              $folderId = "pc-downloads-test-vps-$index"
              $label = "203.0.113.$($index)-Testland-$($index)0GB"
              $token = if ($index -eq 1) { '0123456789abcdef0123456789abcdef' } else { 'fedcba9876543210fedcba9876543210' }
              New-Item -ItemType Directory -Path $serverHome,$files -Force | Out-Null
              & $serverExe generate "--home=$serverHome" | Out-Null
              $args = "serve --home=`"$serverHome`" --no-browser --no-restart --no-upgrade --no-default-folder --gui-address=127.0.0.1:$guiPort --logfile=`"$log`" --logflags=0"
              $process = Start-Process $serverExe -WorkingDirectory $root -ArgumentList $args -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
              [xml]$xml = Get-Content (Join-Path $serverHome 'config.xml')
              $headers = @{'X-API-Key'=[string]$xml.configuration.gui.apikey}
              $api = "http://127.0.0.1:$guiPort"
              $status = $null
              for ($wait=0; $wait -lt 60; $wait++) {
                try { $status = Invoke-RestMethod "$api/rest/system/status" -Headers $headers -TimeoutSec 2; if ($status.myID) { break } } catch {}
                $process.Refresh(); if ($process.HasExited) { break }; Start-Sleep -Milliseconds 500
              }
              if (-not $status.myID) { throw "test VPS $index did not start" }
              $config = Invoke-RestMethod "$api/rest/config" -Headers $headers
              $config.devices = @($config.devices) + [pscustomobject]@{deviceID=$android;name='Android';addresses=@('dynamic');autoAcceptFolders=$true}
              $config.folders = @([pscustomobject]@{id=$folderId;label=$label;path=(Join-Path $files $label);type='sendreceive';fsWatcherEnabled=$true;rescanIntervalS=60;devices=@([pscustomobject]@{deviceID=$status.myID},[pscustomobject]@{deviceID=$android})})
              $config.defaults.folder.path = $files
              $config.options.listenAddresses = @("tcp://127.0.0.1:$syncPort")
              $config.options.globalAnnounceEnabled = $false
              $config.options.localAnnounceEnabled = $false
              $config.options.relaysEnabled = $false
              $config.options.reconnectionIntervalS = 2
              Invoke-RestMethod "$api/rest/config" -Headers $headers -Method Put -ContentType 'application/json' -Body ($config | ConvertTo-Json -Depth 50 -Compress) | Out-Null
              $token | Set-Content $tokenFile -Encoding ASCII
              $configXml = Join-Path $serverHome 'config.xml'
              $enrollerArgs = "`"$enrollerScript`" --config `"$configXml`" --token `"$tokenFile`" --root `"$files`" --android $android --folder-id $folderId --folder-label $label --api $api"
              $enroller = Start-Process $pythonExe -ArgumentList $enrollerArgs -RedirectStandardOutput $enrollerOut -RedirectStandardError $enrollerErr -PassThru -WindowStyle Hidden
              $servers += [pscustomobject]@{Index=$index;Root=$root;Files=$files;Api=$api;Headers=$headers;Status=$status;Process=$process;Enroller=$enroller;FolderId=$folderId;Label=$label;Token=$token;SyncPort=$syncPort}
            }

            $installer = Join-Path $PWD 'v5-multi-vps-f-drive/windows-auto-sync-v5.ps1'
            foreach ($server in $servers) {
              & $installer -VpsDeviceId $server.Status.myID -EnrollmentToken $server.Token -VpsFolderId $server.FolderId -VpsLabel $server.Label -VpsAddress "tcp://127.0.0.1:$($server.SyncPort)"
            }

            $clientRoot = Join-Path $env:LOCALAPPDATA 'VPS-Auto-Sync-v5'
            $clientPort = (Get-Content (Join-Path $clientRoot 'gui-port.txt') -Raw).Trim()
            [xml]$clientXml = Get-Content (Join-Path $clientRoot 'config/config.xml')
            $clientHeaders = @{'X-API-Key'=[string]$clientXml.configuration.gui.apikey}
            $clientApi = "http://127.0.0.1:$clientPort"
            $clientStatus = Invoke-RestMethod "$clientApi/rest/system/status" -Headers $clientHeaders
            $clientConfig = Invoke-RestMethod "$clientApi/rest/config" -Headers $clientHeaders
            foreach ($server in $servers) {
              $folder = @($clientConfig.folders) | Where-Object { $_.id -eq $server.FolderId } | Select-Object -First 1
              $expectedPath = "F:\新建文件夹\$($server.Label)"
              if (-not $folder -or $folder.path -ne $expectedPath) { throw "client folder missing or incorrectly named for VPS $($server.Index)" }
              $serverConfig = Invoke-RestMethod "$($server.Api)/rest/config" -Headers $server.Headers
              $serverFolder = @($serverConfig.folders) | Where-Object { $_.id -eq $server.FolderId } | Select-Object -First 1
              if (@($serverFolder.devices.deviceID) -notcontains $clientStatus.myID) { throw "VPS $($server.Index) did not enroll the Windows device" }
              $source = Join-Path $expectedPath "vps-$($server.Index)-2MiB.bin"
              $payload = New-Object byte[] (2 * 1024 * 1024)
              ([Random]::new(40 + $server.Index)).NextBytes($payload)
              [IO.File]::WriteAllBytes($source, $payload)
              Invoke-RestMethod "$clientApi/rest/db/scan?folder=$($server.FolderId)" -Headers $clientHeaders -Method Post | Out-Null
              $target = Join-Path ([string]$serverFolder.path) (Split-Path $source -Leaf)
              for ($wait=0; $wait -lt 120; $wait++) { if ((Test-Path $target) -and ((Get-FileHash $source).Hash -eq (Get-FileHash $target).Hash)) { break }; Start-Sleep -Milliseconds 500 }
              if (-not (Test-Path $target)) { throw "file did not arrive at VPS $($server.Index)" }
              if ((Get-FileHash $source).Hash -ne (Get-FileHash $target).Hash) { throw "hash mismatch at VPS $($server.Index)" }
            }
            if (@($clientConfig.folders | Where-Object { $_.id -like 'pc-downloads-test-vps-*' }).Count -ne 2) { throw 'client did not retain both VPS folders' }
            if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Startup')) 'VPS-Auto-Sync-v5.lnk'))) { throw 'startup shortcut missing' }
            $chrome = Get-ItemProperty 'HKCU:\Software\Policies\Google\Chrome'
            if ($chrome.DownloadDirectory -ne "F:\新建文件夹\$($servers[1].Label)") { throw 'latest imported VPS is not the browser download folder' }
            Write-Host 'REAL WINDOWS V5 MULTI-VPS E2E PASSED: two peers, two named F-drive folders, startup, policy, enrollment, and byte-exact transfers.'
            $allChecksPassed = $true
            $global:LASTEXITCODE = 0
          } catch {
            $failure = ([string]$_.Exception.Message).Replace("`r", ' ').Replace("`n", ' ')
            Write-Host "::error title=V5 Windows multi-VPS E2E failure::$failure"
            throw
          } finally {
            Get-Process syncthing -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            foreach ($server in $servers) { if ($server.Enroller) { Stop-Process -Id $server.Enroller.Id -Force -ErrorAction SilentlyContinue } }
            Start-Process subst.exe -ArgumentList @('F:','/D') -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue
            $global:LASTEXITCODE = 0
          }
          if ($allChecksPassed) { exit 0 }

      - name: Upload V5 logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v5-windows-multi-vps-logs
          path: C:/Users/runneradmin/AppData/Local/VPS-Auto-Sync-v5/*.log
